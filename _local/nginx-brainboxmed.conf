########################################################################
# REFERÊNCIA — NÃO é usado pelo servidor. Cópia do arquivo real em:
#   /etc/nginx/sites-available/brainboxmed  (servidor brainboxmed-server-01)
# Guardado aqui só para consulta, já que nginx não é versionado.
# Última captura: 2026-07-24 (após adicionar o bloco /magna/api/about-photos)
########################################################################

server {
    server_name brainboxmed.com www.brainboxmed.com brainboxmed.es www.brainboxmed.es brainboxmed.in www.brainboxmed.in brainboxmed.app www.brainboxmed.app;
    location = /favicon.ico { access_log off; log_not_found off; }
    location /static/ {
        alias /home/brainboxmed/brainboxmed/brainboxmed_backend/staticfiles/;
    }
    location /media/ {
        alias /home/brainboxmed/brainboxmed/media/;
    }
    # 1. Redirecionamento amigável
    location = /dosemate {
        return 301 /dosemate/;
    }
    # 2. A API (Deve vir ANTES para o Nginx a priorizar)
    location /dosemate/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # 3. O Frontend
    location /dosemate/ {
        alias /home/brainboxmed/dosemate/docs/;
        index index.html;
        try_files $uri $uri/ /dosemate/index.html;
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|json|webmanifest)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }
    }
    location /magna/api/save-artworks {
        proxy_pass http://127.0.0.1:3100/save-artworks;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }
    location /magna/api/save-exhibitions {
        proxy_pass http://127.0.0.1:3100/save-exhibitions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }
    location /magna/api/upload-painting-image {
        proxy_pass http://127.0.0.1:3100/upload-painting-image;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
    }
    location /magna/api/upload-exhibition-flyer {
        proxy_pass http://127.0.0.1:3100/upload-exhibition-flyer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
    }
    location /magna/api/upload-exhibition-gallery {
        proxy_pass http://127.0.0.1:3100/upload-exhibition-gallery;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
    }
    location /magna/api/check-image {
        proxy_pass http://127.0.0.1:3100/check-image;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
    location /magna {
        alias /home/brainboxmed/magna;
        index index.html;
        try_files $uri $uri/ =404;
    }
    # Adicionado em 2026-07-24 — faltava este bloco, causava 404 no slideshow do About
    location /magna/api/about-photos {
        proxy_pass http://127.0.0.1:3100/about-photos;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
    location /finance/ {
        proxy_pass http://127.0.0.1:8501/finance/;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
    location /shortrental/ {
        alias /home/brainboxmed/shortrental/;
        index index.html;
        try_files $uri $uri/ =404;
    }
    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
    }
    listen 443 ssl default_server; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/brainboxmed.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/brainboxmed.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.brainboxmed.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = brainboxmed.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80 default_server;
    server_name brainboxmed.com www.brainboxmed.com brainboxmed.in www.brainboxmed.in brainboxmed.es www.brainboxmed.es brainboxmed.app www.brainboxmed.app;
    return 404; # managed by Certbot
}
