########################################################################
# REFERÊNCIA — NÃO é usado pelo servidor. Cópia do arquivo real em:
#   /etc/nginx/sites-available/magnaleite  (servidor brainboxmed-server-01)
# Guardado aqui só para consulta, já que nginx não é versionado.
# Captura: Setembro 2026 (colada por Thiago diretamente do servidor).
#
# NOTA IMPORTANTE (ver manual técnico, secção 9, ponto 1 — atualização):
# Ao contrário do vhost "brainboxmed", este vhost serve o projeto na RAIZ
# do domínio (location / { root /home/brainboxmed/magna; ... }), não em
# /magna. Por isso os seus blocos de API usam o prefixo /api/... (sem
# /magna), EXCETO dois blocos (about-photos e save-collections) que foram
# colados com o prefixo /magna/api/... por engano/inconsistência — esses
# dois nunca são atingidos por nenhum pedido real neste vhost.
#
# MAIS IMPORTANTE AINDA: o frontend e o admin (magna-manager) têm o
# domínio da API sempre hardcoded para https://brainboxmed.com/magna/api/*
# (constantes BASE_URL / API_ENDPOINT / API_BASE no código, independente
# de estares a ver a página em magnaleite.com ou brainboxmed.com). Isso
# significa que, no estado atual do código, NENHUM destes blocos de API
# deste vhost é chamado por nada — são todos código morto. O backend
# (save-artworks.js) já tem CORS configurado especificamente para aceitar
# pedidos com origin https://magnaleite.com dirigidos a brainboxmed.com,
# o que confirma que este é o desenho intencional atual.
#
# Ação recomendada: não é preciso replicar os blocos novos (verify-secret,
# save-collections, save-price-tiers, update-stripe-price) aqui — só no
# vhost brainboxmed, que é o único realmente chamado. Mas vale a pena, em
# algum momento, limpar os blocos de API mortos deste ficheiro (ou
# documentar claramente que são vestigiais) para não confundir quem vier
# a mexer nisto sem saber deste detalhe.
########################################################################

server {
    server_name magnaleite.com www.magnaleite.com;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /api/save-artworks {
        proxy_pass http://127.0.0.1:3100/save-artworks;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    location /api/save-exhibitions {
        proxy_pass http://127.0.0.1:3100/save-exhibitions;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;
    }

    location /api/upload-painting-image {
        proxy_pass http://127.0.0.1:3100/upload-painting-image;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
    }

    location /api/upload-exhibition-flyer {
        proxy_pass http://127.0.0.1:3100/upload-exhibition-flyer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
    }

    location /api/upload-exhibition-gallery {
        proxy_pass http://127.0.0.1:3100/upload-exhibition-gallery;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
    }

    location /api/check-image {
        proxy_pass http://127.0.0.1:3100/check-image;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # ⚠ Prefixo /magna/api/ inconsistente com os blocos acima (/api/) —
    # nunca atingido por nenhum pedido real deste vhost (ver nota no topo).
    location /magna/api/about-photos {
       proxy_pass http://127.0.0.1:3100/about-photos;
       proxy_set_header Host $host;
    }

    # ⚠ Mesma inconsistência de prefixo, e faltam os headers X-Real-IP /
    # X-Forwarded-For / X-Forwarded-Proto / client_max_body_size que os
    # outros blocos têm — também nunca atingido na prática.
    location /magna/api/save-collections {
       proxy_pass http://127.0.0.1:3100/save-collections;
       proxy_set_header Host $host;
    }

    location / {
        root /home/brainboxmed/magna;
        index index.html;
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/magnaleite.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/magnaleite.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.magnaleite.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = magnaleite.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name magnaleite.com www.magnaleite.com;

    listen 80;
    return 404; # managed by Certbot
}
